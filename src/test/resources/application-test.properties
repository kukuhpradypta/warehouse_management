# In-memory H2 in PostgreSQL mode, schema created by the same Flyway migrations as production.
spring.datasource.url=jdbc:h2:mem:warehouse;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;LOCK_TIMEOUT=10000;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Tests create their own data, so sample data is not loaded.
spring.flyway.locations=classpath:db/migration
