spring.application.name=warehouse-management
server.port=${SERVER_PORT:8080}

# Database connection is read exclusively from the .env file (via spring-dotenv) or real
# environment variables. No credentials or database name live in this file. Startup fails
# fast if any of them is missing, so it is always unambiguous which database is used.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Schema is owned by Flyway; Hibernate only validates that the mapping matches it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# db/seed holds optional sample data. Set SPRING_FLYWAY_LOCATIONS=classpath:db/migration to skip it.
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# Reject unknown JSON fields so clients cannot assume they changed id, stockQuantity, createdAt, etc.
spring.jackson.deserialization.fail-on-unknown-properties=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Scalar API reference UI at /docs, rendering the springdoc OpenAPI document.
scalar.enabled=true
scalar.path=/docs
scalar.url=/v3/api-docs
scalar.theme=deepSpace

logging.level.com.shop.warehouse=INFO
